# Netlify — site tĩnh. Cấu hình Supabase (public) đã nằm sẵn trong js/config.js
# nên không cần bước build. Chỉ publish toàn bộ thư mục gốc.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
